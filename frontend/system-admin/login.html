<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDHRS | System Admin Login</title>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body class="auth-page">
<div class="hazard" style="background:repeating-linear-gradient(135deg,#0B0B12 0 12px,#0A6BFF 12px 24px);"></div>
<div class="auth-wrap" style="padding:0 16px;min-height:calc(100vh - 28px);"><div class="auth-shell" style="border-radius:0;box-shadow:none;max-width:1000px;min-height:600px;">
  <div class="auth-panel restricted" style="justify-content:flex-start;padding-top:70px;">
    <svg class="deco" style="left:0;bottom:70px;width:100%;height:150px" viewBox="0 0 400 150" preserveAspectRatio="none">
<defs><pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="14" height="28" fill="#0B0B12"/><rect x="14" width="14" height="28" fill="#0A6BFF"/></pattern></defs>
<polygon points="0,60 400,120 400,150 0,90" fill="url(#hz)"/><polygon points="0,120 400,50 400,80 0,150" fill="url(#hz)"/></svg>
    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:6px">
<path d="M12 2.5 1 21.5h22L12 2.5z" fill="#0A6BFF" stroke="#0B1B4D" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="11" y="9.5" width="2" height="6" rx="1" fill="#0B1B4D"/><circle cx="12" cy="18" r="1.25" fill="#0B1B4D"/></svg>
    <h2 style="color:#fff;">Restricted<br>Access</h2>
    <p style="font-weight:600;position:relative;z-index:2;">This console controls every Patient, Doctor, Technician record on CDHRS. Only verified stuff can Sign In</p>
  </div>
  <div class="auth-form" style="padding-top:20px;">
    <h1>Welcome Back!</h1>
    <div class="sub">Signin to access your account</div>
    <form method="post" data-auth="login" data-portal="system-admin" novalidate style="margin-top:36px;">
      <div class="field"><label>Email</label><input type="email" name="email" placeholder="Enter Your Email" required></div>
      <div class="field"><label>Password</label><input type="password" name="password" placeholder="Enter Your Password" required></div>
      <div class="between"><label><input type="checkbox"> Remember me</label><a href="#">Forget Password?</a></div>
      <div class="form-error" hidden></div>
      <button type="submit" class="btn btn-dark btn-block" style="margin-bottom:10px;font-size:20px;">Continue with password</button>
    </form>
    <button type="button" class="btn btn-outline btn-block" style="font-size:19px;">Sign In with security key or passkey</button>
    <div class="footnote">Lost your authenticator? <b>Contact to the security team</b></div>
  </div>
</div></div>
<div class="hazard" style="background:repeating-linear-gradient(135deg,#0B0B12 0 12px,#0A6BFF 12px 24px);"></div>
<script src="../shared/auth.js"></script>
</body>
</html>
