    <a href="../index.html" class="brand-pill" style="background:#1F2A80;">CDHRS</a>
    <div style="align-self:flex-start;text-align:left;margin-top:8px;">
      <h2 style="font-size:32px;max-width:300px;">Every patient record, one search away.</h2>
      <p style="margin:10px 0 0;font-weight:600;">Access authorized patient information securely</p>
    </div>

</svg></div>
  </div>
  <div class="auth-form">
    <h1>Welcome Back!</h1>
    <div class="sub">Signin to access your provider account</div>
    <button type="button" class="btn btn-outline btn-block" style="margin-bottom:6px;font-size:20px;padding:10px;"><svg width="22" height="22" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.5C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg> Sign In with Google</button>
    <div class="divider">or</div>
    <form method="post" data-auth="login" data-portal="doctor" novalidate>
      <div class="field"><label>Email</label><input type="email" name="email" placeholder="Enter Your Email" required></div>
      <div class="field"><label>Password</label><input type="password" name="password" placeholder="Enter Your Password" required></div>
      <div class="between"><label><input type="checkbox"> Remember me</label><a href="#">Forget Password?</a></div>
      <div class="form-error" hidden></div>
      <button type="submit" class="btn btn-dark btn-block" style="font-size:20px;">Sign In</button>
    </form>
    <div class="footnote">Doctor accounts are created by your Hospital Admin. <b>Contact your hospital</b> for access.</div>
  </div>
</div></div>
<script src="../shared/auth.js"></script>
