<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDHRS | Doctor Activity Log</title>
<link rel="stylesheet" href="../shared/styles.css">
<link rel="stylesheet" href="doctor.css">
<style>
.activity-table{min-width:640px;}
</style>
</head>
<body data-page="activity-log" data-portal="doctor">
<div class="portal">
  <header class="topbar">
    <div class="brand">🩺 Doctor Portal</div>
    <div class="avatar-pill"><span class="avatar-circle">FA</span> Dr. Farhana Akter ▾</div>
  </header>
  <div class="portal-body">
    <nav class="sidebar" aria-label="Doctor portal">
      <a class="side-item" href="profile.html">🔍 Patient Search</a>
      <a class="side-item" href="prescription.html">💊 Prescription</a>
      <a class="side-item" href="medical-reports.html">📋 Medical Reports</a>
      <a class="side-item" href="lab-reports.html">🧪 Lab Reports</a>
      <a class="side-item" href="emergency-access.html">🚨 Emergency Access</a>
      <a class="side-item active" href="activity-log.html" aria-current="page">🕒 Activity Log</a>
    </nav>
    <main class="content">
      <div class="page-heading">
        <div>
          <h1 class="page-title">Activity Log</h1>
          <p>Everything you did in the doctor portal: searches, reports viewed, prescriptions, consent and overrides.</p>
        </div>
        <span class="pill-badge badge-neutral" data-activity-count></span>
      </div>

      <section class="card">
        <div class="search-row" style="margin-bottom:14px;">
          <input type="search" aria-label="Search activity" placeholder="Search by patient, ID or detail" data-activity-search>
          <select aria-label="Filter by action" data-activity-type>
            <option value="">All actions</option>
            <option>Patient search</option>
            <option>Viewed report</option>
            <option>Prescription issued</option>
            <option>OTP requested</option>
            <option>Consent granted</option>
            <option>Emergency override</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="activity-table">
            <thead><tr><th>Time</th><th>Action</th><th>Patient</th><th>Details</th></tr></thead>
            <tbody data-activity-rows></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="../shared/auth.js"></script>
<script src="doctor.js"></script>
</body>
</html>
