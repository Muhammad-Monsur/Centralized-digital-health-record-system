
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CDHRS | Create Account</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* ================= MAIN ================= */

.register-container{

    width:1000px;
    max-width:95%;
    min-height:600px;

    display:flex;

    border-radius:6px;
    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,.15);
}


/* ================= LEFT ================= */

.left-section{

    width:45%;

    background:#8095f0;
    color:white;

    padding:35px;

    display:flex;
    flex-direction:column;

    justify-content:flex-start;
    align-items:center;

    position:relative;
    overflow:hidden;
}


/* LOGO */

.logo{

    background:#1F2A80;

    padding:5px 16px;

    border-radius:15px;

    font-size:13px;
    font-weight:bold;

    margin-bottom:40px;
}


/* TEXT */

.left-section h1{

    font-size:30px;
    line-height:1.25;

    width:100%;

    margin-bottom:10px;
}

.left-section p{

    font-size:13px;

    width:100%;

    line-height:1.5;
}


/* ================= DECORATION ================= */

.deco{

    position:absolute;

    pointer-events:none;
}


/* ================= DOCTOR ================= */

.doctor{

    margin-top:auto;

    width:230px;
    height:230px;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.doctor img{

    width:100%;
    height:100%;

    object-fit:contain;
}


/* ================= RIGHT ================= */

.right-section{

    width:55%;

    background:#b0b4eb;

    padding:36px 40px;

    display:flex;
    flex-direction:column;

    justify-content:flex-start;
}


.right-section h2{

    color:#1d579d;

    font-size:27px;

    margin-bottom:5px;
}


.subtitle{

    color:#6473ca;

    font-size:12px;

    margin-bottom:22px;
}


/* ================= FORM ================= */

form{

    width:100%;
}


.row2{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;
}


.field{

    width:100%;

    margin-bottom:14px;
}


.field label{

    display:block;

    color:#315aa0;

    font-size:12px;

    font-weight:bold;

    margin-bottom:6px;
}


.field input,
.field select{

    width:100%;

    height:39px;

    border:none;

    border-radius:6px;

    padding:0 11px;

    background:#a6adea;

    outline:none;

    color:#333;

    font-size:12px;
}


.field input::placeholder{

    color:#8c94d1;
}


.field select{

    cursor:pointer;
}


/* ================= TERMS ================= */

.terms{

    display:flex;

    align-items:flex-start;

    gap:7px;

    color:#2B4A9E;

    font-size:11px;

    line-height:1.4;

    font-weight:600;

    margin-top:2px;

    margin-bottom:16px;
}


.terms input{

    margin-top:2px;

    accent-color:#315aa0;

    cursor:pointer;
}


/* ================= ERROR ================= */

.form-error{

    display:none;

    background:#ffe3e3;

    color:#a52a2a;

    border:1px solid #e5a5a5;

    padding:8px 10px;

    border-radius:5px;

    font-size:11px;

    margin-bottom:12px;
}


/* ================= SUCCESS ================= */

.form-success{

    display:none;

    background:#dff5e5;

    color:#21733a;

    border:1px solid #9bd3aa;

    padding:8px 10px;

    border-radius:5px;

    font-size:11px;

    margin-bottom:12px;
}


/* ================= BUTTON ================= */

.create-btn{

    width:100%;

    height:42px;

    background:#28599e;

    color:white;

    border:none;

    border-radius:6px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}


.create-btn:hover{

    background:#1d4784;

}


/* ================= LOGIN ================= */

.login-link{

    text-align:center;

    margin-top:20px;

    color:#5c70c4;

    font-size:11px;

    font-weight:bold;
}


.login-link a{

    color:#315aa0;

    text-decoration:none;
}


.login-link a:hover{

    text-decoration:underline;
}


/* ================= RESPONSIVE ================= */

@media(max-width:750px){

    .register-container{

        flex-direction:column;

    }

    .left-section,
    .right-section{

        width:100%;

    }

    .left-section{

        min-height:350px;

    }

    .doctor{

        width:180px;
        height:180px;

    }

    .row2{

        grid-template-columns:1fr;

        gap:0;

    }

}

</style>

</head>


<body>


<div class="register-container">


<!-- ==================================================
     LEFT SECTION
================================================== -->

<div class="left-section">


    <div class="logo">
        CDHRS
    </div>


    <h1>
        Start your health<br>
        record journey
    </h1>


    <p>
        Create your account once and carry
        every report with you.
    </p>


    <!--
        তোমার নিজের doctor image এখানে দাও।

        যদি doctor.png একই folder-এ থাকে:
        src="doctor.png"

        যদি assets folder-এ থাকে:
        src="assets/doctor.png"
    -->

    <div class="doctor">

        <img
            src="doctor_2-removebg-preview.png"
            alt="Doctor"
        >

    </div>


</div>



<!-- ==================================================
     RIGHT SECTION
================================================== -->

<div class="right-section">


    <h2>
        Create Account
    </h2>


    <div class="subtitle">
        Join CDHRS as a patient
    </div>



    <form id="registerForm">


        <!-- FULL NAME + DOB -->

        <div class="row2">


            <div class="field">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >

            </div>



            <div class="field">

                <label>
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                >

            </div>


        </div>



        <!-- EMAIL + PHONE -->

        <div class="row2">


            <div class="field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>



            <div class="field">

                <label>
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="+880 1XXX XXXXXX"
                >

            </div>


        </div>



        <!-- GENDER -->

        <div class="field">

            <label>
                Gender
            </label>

            <select id="gender">

                <option value="">
                    Select gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>



        <!-- PASSWORD -->

        <div class="row2">


            <div class="field">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                >

            </div>



            <div class="field">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter password"
                >

            </div>


        </div>



        <!-- TERMS -->

        <label class="terms">

            <input
                type="checkbox"
                id="terms"
            >

            <span>
                I agree to the Terms of Service
                and Privacy Policy.
            </span>

        </label>



        <!-- ERROR -->

        <div
            class="form-error"
            id="errorMessage">
        </div>



        <!-- SUCCESS -->

        <div
            class="form-success"
            id="successMessage">

            Account created successfully!

        </div>



        <!-- BUTTON -->

        <button
            type="submit"
            class="create-btn">

            Create Account

        </button>


    </form>



    <!-- LOGIN -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Sign in
        </a>

    </div>


</div>

</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>


document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        function(event){

            event.preventDefault();


            /* GET VALUES */

            const name =
                document
                .getElementById("fullName")
                .value
                .trim();


            const dob =
                document
                .getElementById("dob")
                .value;


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const phone =
                document
                .getElementById("phone")
                .value
                .trim();


            const gender =
                document
                .getElementById("gender")
                .value;


            const password =
                document
                .getElementById("password")
                .value;


            const confirmPassword =
                document
                .getElementById("confirmPassword")
                .value;


            const terms =
                document
                .getElementById("terms")
                .checked;


            const error =
                document
                .getElementById("errorMessage");


            const success =
                document
                .getElementById("successMessage");


            /* RESET */

            error.style.display = "none";
            success.style.display = "none";


            /* VALIDATION */

            if(name === ""){

                showError(
                    "Please enter your full name."
                );

                return;

            }


            if(dob === ""){

                showError(
                    "Please select your date of birth."
                );

                return;

            }


            if(email === ""){

                showError(
                    "Please enter your email."
                );

                return;

            }


            if(!email.includes("@")){

                showError(
                    "Please enter a valid email address."
                );

                return;

            }


            if(phone === ""){

                showError(
                    "Please enter your phone number."
                );

                return;

            }


            if(gender === ""){

                showError(
                    "Please select your gender."
                );

                return;

            }


            if(password === ""){

                showError(
                    "Please create a password."
                );

                return;

            }


            if(password.length < 6){

                showError(
                    "Password must contain at least 6 characters."
                );

                return;

            }


            if(confirmPassword === ""){

                showError(
                    "Please confirm your password."
                );

                return;

            }


            if(password !== confirmPassword){

                showError(
                    "Passwords do not match."
                );

                return;

            }


            if(!terms){

                showError(
                    "Please agree to the Terms of Service and Privacy Policy."
                );

                return;

            }


            /* SAVE DEMO ACCOUNT */

            const patient = {

                name:name,

                dob:dob,

                email:email,

                phone:phone,

                gender:gender,

                password:password,

                patientId:
                    "P-" +
                    Math.floor(
                        100000 +
                        Math.random() * 900000
                    )

            };


            /*
                Simulation only:
                browser-এর localStorage-এ account save হচ্ছে।
            */

            localStorage.setItem(
                "cdhrsPatient",
                JSON.stringify(patient)
            );


            /* SUCCESS */

            success.style.display = "block";


            /*
                1.5 second পরে Login page
            */

            setTimeout(
                function(){

                    window.location.href =
                        "login.html";

                },
                1500
            );

        }
    );



/* ================= ERROR FUNCTION ================= */

function showError(message){

    const error =
        document
        .getElementById("errorMessage");


    error.innerText =
        message;


    error.style.display =
        "block";

}

</script>


</body>

</html>
