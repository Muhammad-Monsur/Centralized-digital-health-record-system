<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDHRS - End User Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 900px;
            max-width: 95%;
            min-height: 520px;
            display: flex;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .left-section {
            width: 48%;
            background: #8095f0;
            color: white;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: left;
        }

        .logo {
            background: #173f8f;
            padding: 4px 15px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 45px;
        }

        .left-section h1 {
            font-size: 25px;
            line-height: 1.25;
            width: 100%;
            margin-bottom: 8px;
        }

        .left-section p {
            font-size: 13px;
            width: 100%;
            margin-bottom: 20px;
        }

        .doctor {
            width: 230px;
            height: 230px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .doctor img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .right-section {
            width: 52%;
            background: #b0b4eb;
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-section h2 {
            color: #1d579d;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #6473ca;
            font-size: 11px;
            margin-bottom: 30px;
        }

        .google-btn {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 6px;
            background: #a6adea;
            color: #5364ad;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 18px;
        }

        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #d7d9f4;
            flex: 1;
        }

        .form-group {
            width: 100%;
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            color: #315aa0;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            background: #a6adea;
            outline: none;
            color: #333;
        }

        .form-group input::placeholder {
            color: #8c94d1;
        }

        .options {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #6370bd;
            font-size: 12px;
            margin-bottom: 28px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .remember input {
            accent-color: #315aa0;
        }

        .forgot {
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            height: 42px;
            background: #28599e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4784;
        }

        .register {
            margin-top: 30px;
            color: #5c70c4;
            font-size: 11px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .login-container {
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .left-section {
                min-height: 350px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- LEFT -->
        <div class="left-section">

            <div class="logo">CDHRS</div>

            <h1>Every report you<br>had, in one place.</h1>

            <p>Access your reports anytime, from anywhere</p>

            <div class="doctor">
                <img src="doctor_2-removebg-preview.png" alt="Doctor">
            </div>

        </div>


        <!-- RIGHT -->
        <div class="right-section">

            <h2>Welcome Back!</h2>
            <p class="subtitle">Sign in to access your account</p>

            <button class="google-btn">
                <img src="3b5d653109a9b36198537eb57d1400ca-removebg-preview.png" width="18" height="18">
                &nbsp; Sign In with Google
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="loginForm" style="width:100%;">

                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Your Email"
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Your Password"
                    >
                </div>

                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <span class="forgot">
                        Forget Password?
                    </span>

                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

            </form>

            <p class="register">
    New to CDHRS?
    <a href="patient-register.html" style="color:#5c70c4; text-decoration:none;">
        Create a patient account
    </a>
</p>

        </div>

    </div>


    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (email === "") {
                alert("Please enter your email.");
                return;
            }

            if (!email.includes("@")) {
                alert("Please enter a valid email.");
                return;
            }

            if (password === "") {
                alert("Please enter your password.");
                return;
            }

            alert("Login Successful!");

            window.location.href = "patient-dashboard.html";

        });

    </script>

</body>

</html>
