{# Shared left panel for sign-in / registration: the "health card" motif. #}
<aside class="auth-aside" aria-hidden="true">
  <div>
    <h2>{{ aside_title|default("Your health history, in your hands.") }}</h2>
    <p>{{ aside_text|default("Doctors see your private records only after you approve, and every access lands in your history.") }}</p>
  </div>
  <svg class="aside-art" viewBox="0 0 420 300" role="presentation">
    <defs>
      <linearGradient id="aa-card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".98"/><stop offset="1" stop-color="#E8F3FC"/></linearGradient>
    </defs>
    <g style="animation: float-y-sm 7s ease-in-out infinite; transform-box: fill-box">
      <rect x="70" y="40" width="300" height="186" rx="18" fill="#fff" opacity=".18" transform="rotate(-6 220 133)"/>
    </g>
    <g style="animation: float-y 6s ease-in-out infinite">
      <rect x="50" y="60" width="300" height="186" rx="18" fill="url(#aa-card)"/>
      <rect x="74" y="86" width="44" height="34" rx="7" fill="#0F4C81" opacity=".12"/>
      <path d="M96 94v18M87 103h18" stroke="#0F4C81" stroke-width="3.5" stroke-linecap="round"/>
      <text x="132" y="101" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#475569">UNIQUE PATIENT ID</text>
      <text x="132" y="117" font-family="Public Sans, sans-serif" font-size="11" fill="#64748B">Issued by CDHRS</text>
      <text x="74" y="170" font-family="Public Sans, sans-serif" font-size="23" font-weight="700" letter-spacing="1.5" fill="#0F4C81">CDH-7KQ2-M9XA-4TPR</text>
      <rect x="74" y="196" width="120" height="8" rx="4" fill="#CBD5E1"/>
      <rect x="74" y="212" width="80" height="8" rx="4" fill="#E2E8F0"/>
      <circle cx="312" cy="206" r="18" fill="#15803D" opacity=".14"/>
      <path d="m304 206 6 6 11-12" stroke="#15803D" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>
  <p class="small" style="margin:0;opacity:.8">Team CDHRS</p>
</aside>
