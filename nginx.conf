# CDHRS: nginx as load balancer + static file server.
# Used by docker-compose (--profile full). For a VPS, copy the http{} contents into
# /etc/nginx/conf.d/cdhrs.conf and change the upstream servers to 127.0.0.1:800x.
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;

  # --- compression (the app also compresses dynamic responses; nginx handles static) ---
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 500;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  # Brotli needs the ngx_brotli module (not in the stock image). If available:
  #   brotli on; brotli_comp_level 5; brotli_types text/css application/javascript application/json image/svg+xml;

  # --- rate limiting (defence in depth; the app enforces per-account limits too) ---
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  # --- load balancing ---
  # Round-robin is fine: sessions live in Redis, so no sticky sessions are needed.
  upstream cdhrs_app {
    least_conn;
    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;
    server app3:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Production: redirect HTTP to HTTPS (uncomment together with the 443 server below).
  # server { listen 80; server_name cdhrs.example.com; return 301 https://$host$request_uri; }

  server {
    listen 80;
    # listen 443 ssl http2;
    # server_name cdhrs.example.com;
    # ssl_certificate     /etc/letsencrypt/live/cdhrs.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cdhrs.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_session_cache shared:SSL:10m;

    client_max_body_size 12m;   # MAX_UPLOAD_MB (10) + form overhead
    client_body_timeout 30s;

    # Proxy settings (inherited by every location below).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the edge: OVERWRITE (don't append to) X-Forwarded-For, so a client can't
    # spoof its IP to dodge per-IP rate limits or falsify audit logs. If you put a CDN or
    # another proxy in front, use the real_ip module with that proxy's address ranges instead.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Fingerprinted build output: never changes -> cache forever (browser + CDN).
    location /static/dist/ {
      alias /srv/static/dist/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff;
      access_log off;
    }
    # Other static files (favicon, dev files): short cache + revalidation.
    location /static/ {
      alias /srv/static/;
      add_header Cache-Control "public, max-age=3600";
      add_header X-Content-Type-Options nosniff;
      access_log off;
    }

    location = /api/v1/auth/login { limit_req zone=auth burst=5 nodelay; proxy_pass http://cdhrs_app; }
    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://cdhrs_app; }
    location / { proxy_pass http://cdhrs_app; }

    # Pages with health data are sent "Cache-Control: no-store" by the app; nginx never
    # caches proxied responses (no proxy_cache configured), so PHI can't land in a shared cache.
  }

}
